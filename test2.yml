- name: Debug Environment
  hosts: localhost
  gather_facts: true  # Changed to true to get environment info
  tasks:
    - name: Show current working directory
      command: pwd
      register: pwd_out

    - name: List files in project root
      command: ls -F
      register: ls_root

    - name: Check if collections folder exists and show content
      command: ls -R collections
      register: ls_coll
      ignore_errors: true

    - name: Final Report
      debug:
        msg: 
          - "Current Dir: {{ pwd_out.stdout }}"
          - "Files in Root: {{ ls_root.stdout_lines }}"
          - "Collections Found: {{ ls_coll.stdout_lines }}"
