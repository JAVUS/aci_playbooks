---
- name: Playbook Cisco ACI
  hosts: localhost
  gather_facts: false
  
  # This makes Ansible look for the collection without depending on cfg file
  collections:
    - cisco.aci

  tasks:
    - name: Create new tenant on ACI
      cisco.aci.aci_tenant:
        host: "{{ aci_host }}"
        username: "{{ aci_user }}"
        password: "{{ aci_password }}"
        tenant: "Tenant_Ansible_AWX"
        description: "Created via Ansible AWX"
        state: present
        validate_certs: false
